# Written by `artifacts setup --docker`, with secrets in .env beside it. Put a reverse proxy in front for HTTPS (README).
services:
  artifacts:
    image: ${ARTIFACTS_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://artifacts:${POSTGRES_PASSWORD}@postgres:5432/artifacts
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: auto
      S3_BUCKET: artifacts
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      MORE_URLS: ${MORE_URLS:-}
      CONTENT_URL: ${CONTENT_URL}
      SETUP_TOKEN: ${SETUP_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      OPS_SECRET: ${OPS_SECRET}
    ports:
      - "${VIEWER_PORT}:8080"
      - "${LIVE_PORT}:8081"

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: artifacts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: artifacts
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artifacts -d artifacts"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    # Explicit limits: left alone, weed derives the volume count from free disk and small disks get none (09).
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=100
    ports:
      - "${S3_PORT}:8333"
    volumes:
      - seaweedfs:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || nc -z 127.0.0.1 8333"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  postgres:
  seaweedfs:
