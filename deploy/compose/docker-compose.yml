# Written by `artifacts setup --docker`, with secrets in .env beside it. Put a reverse proxy in front for HTTPS (README).
# The ports are published on BIND_ADDRESS (127.0.0.1 unless .env says otherwise), for a reverse proxy on this machine.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  artifacts:
    image: ${ARTIFACTS_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://artifacts:${POSTGRES_PASSWORD}@postgres:5432/artifacts
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: auto
      S3_BUCKET: artifacts
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      MORE_URLS: ${MORE_URLS:-}
      CONTENT_URL: ${CONTENT_URL}
      SETUP_TOKEN: ${SETUP_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      OPS_SECRET: ${OPS_SECRET}
    # 8082, the operators' port, is deliberately not published.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${VIEWER_PORT}:8080"
      - "${BIND_ADDRESS:-127.0.0.1}:${LIVE_PORT}:8081"
    # The server runs as a non-root user and writes nothing to disk.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 1024
    logging: *logging

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: artifacts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: artifacts
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artifacts -d artifacts"]
      interval: 5s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    # What the image's entrypoint needs to own the data folder and drop to the postgres user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    logging: *logging

  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    # weed ignores SIGTERM as PID 1, so a stop waited ten seconds and then killed it mid-write.
    init: true
    # The key pair comes from .env as weed's AWS_* variables, so no file holds it. Without them weed's S3 is open to
    # anyone, which is why ${...:?} refuses to start rather than fall back to nothing.
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set in .env}
    # Explicit limits: left alone, weed derives the volume count from free disk and small disks get none (09).
    command: server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=100
    # The S3 port is the only one published: presigned URLs go straight to it (S3_PUBLIC_ENDPOINT).
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT}:8333"
    volumes:
      - seaweedfs:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 60
    read_only: true
    tmpfs:
      - /tmp
    # The entrypoint takes ownership of /data, then drops to the seaweed user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 1024
    logging: *logging

volumes:
  postgres:
  seaweedfs:
