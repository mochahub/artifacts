# Local development: Postgres and SeaweedFS (`bun run dev` starts this). Dev-only credentials; never use these in production.
name: artifacts-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: artifacts
      POSTGRES_PASSWORD: artifacts
      POSTGRES_DB: artifacts
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artifacts -d artifacts"]
      interval: 1s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    # Explicit limits: left alone, weed derives the volume count from free disk and small disks get none.
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=64 -volume.max=100
    # Only the S3 port is published: weed's volume server uses 8080 inside the container.
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./seaweedfs/s3.dev.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || nc -z 127.0.0.1 8333"]
      interval: 1s
      timeout: 3s
      retries: 60

volumes:
  postgres:
  seaweedfs:
