name: Bug report
description: Something doesn't work as the docs say it should.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, don't use this form. Use the private report link on the issue chooser, and read SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands or taps, in order. A small artifact that shows it helps.
      placeholder: |
        1. artifacts publish
        2. Open the link on an iPhone
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it go wrong
      options:
        - The viewer (phone or desktop)
        - The CLI
        - The server or deploying it
        - Live previews or a micro app backend
        - The skill
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `artifacts --version`, and the server's version from `artifacts doctor`.
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: How the server runs
      options:
        - Railway
        - Docker Compose
        - Running from source
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For viewer bugs, for example Safari on iOS 19 or Chrome on macOS.
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Output of `artifacts doctor`, server log lines, or a screenshot. Remove tokens, links to private artifacts and anything else secret first.
      render: shell
