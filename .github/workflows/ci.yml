name: CI

on: [push]

jobs:
  check:
    # Blacksmith, as in Perpetua. It only serves organizations, so this repo must live under one.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Typecheck and Biome
        run: bun run lint
      - name: Migrations match the schema
        run: |
          bun run db:generate
          git diff --exit-code apps/server/drizzle
          test -z "$(git status --porcelain apps/server/drizzle)"
      # Before the tests: the CLI's render tests drive WebKit too.
      - name: Install WebKit
        run: bunx playwright install --with-deps webkit chromium
        working-directory: apps/viewer
      # SeaweedFS needs a command and a mounted key file, which `services:` can't give it.
      - name: Unit, data-model and API tests against Postgres and SeaweedFS
        run: bun run test
      - name: Build
        run: bun run build
      - name: The compiled CLI builds and runs
        run: |
          bun scripts/build-cli.ts dist/ci linux-x64
          dist/ci/artifacts-linux-x64 --version
      - name: The compiled CLI ignores the .env where it runs
        run: |
          cli=$PWD/dist/ci/artifacts-linux-x64
          cd "$(mktemp -d)"
          echo 'ARTIFACTS_URL=http://from-dotenv.invalid' > .env
          if "$cli" whoami 2>&1 | grep -F from-dotenv; then exit 1; fi
      - name: Viewer size budget
        run: bun run size
      - name: Playwright WebKit at iPhone size and desktop
        run: bun run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: apps/viewer/test-results
          if-no-files-found: ignore
